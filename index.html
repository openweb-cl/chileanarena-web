	width: 100%;

<script>
// Avisos anónimos de error (propietario, 3 nov 2026: «levantar alertas por posibles cosas malas»).
// Aparecen en GoatCounter como eventos «error/…», solo con el tipo de falla: nunca el texto del
// error, el nombre del jugador ni nada que identifique a la persona. Funcionan aunque el juego no
// alcance a arrancar, por eso viven en la página y no dentro de Godot. Solo en chileanarena.cl.
(function () {
	if (!/(^|[.])chileanarena[.]cl$/.test(location.hostname)) return;
	var sent = {};
	function report(kind) {
		if (sent[kind]) return;
		sent[kind] = true;
		var path = 'error/' + kind, title = 'Error: ' + kind;
		if (window.__caStats) { window.__caStats.send(path, title); return; }
		// GoatCounter aún no está cargado: conteo directo con una imagen.
		var img = new Image();
		img.src = 'https://chileanarena.goatcounter.com/count?e=true&p=' + encodeURIComponent(path) + '&t=' + encodeURIComponent(title) + '&rnd=' + Math.random();
	}
	window.__caError = report;
	// Sin WebGL 2 el 3D del juego no puede abrir.
	try { if (!document.createElement('canvas').getContext('webgl2')) report('webgl'); } catch (e) { report('webgl'); }
	window.addEventListener('error', function () { report('pagina'); });
	window.addEventListener('unhandledrejection', function () { report('pagina'); });
	document.addEventListener('DOMContentLoaded', function () {
		// Godot muestra #status-notice cuando no puede iniciar: navegador sin funciones necesarias o
		// descarga cortada.
		var notice = document.getElementById('status-notice');
		var missing = 0;
		try { missing = window.Engine && Engine.getMissingFeatures ? Engine.getMissingFeatures({threads: false}).length : 0; } catch (e) {}
		if (notice && window.MutationObserver) {
			new MutationObserver(function () {
				if (notice.style.display === 'block') report(missing ? 'navegador' : 'inicio');
			}).observe(notice, {attributes: true, attributeFilter: ['style']});
		}
	});
	// Si tras 2 minutos con la pantalla visible el juego no llegó al menú, se cuenta como carga lenta
	// o trabada (las pestañas en segundo plano no cuentan: el navegador las frena).
	var visible = 0, last = Date.now();
	var timer = setInterval(function () {
		var now = Date.now();
		if (!document.hidden) visible += now - last;
		last = now;
		if (window.__caReady) clearInterval(timer);
		else if (visible > 120000) { report('carga-lenta'); clearInterval(timer); }
	}, 2000);
})();
</script>

<script>
// El 3D se cortó (amigo del propietario, 16 nov 2026: Chrome en Android mostró «WebGL context lost,
// please reload the page»). Godot no puede recuperar el 3D y avisaba en inglés con una ventana del
// navegador; ahora se explica en español y un toque recarga. El avance ya guardado sigue en el
// equipo (Godot lo escribe al guardar); la pelea que estaba a medias no cuenta.
//
// Modo liviano (17 nov 2026): al mismo amigo, con un Honor Magic 8 Lite de 8 GB y pantalla de
// 2640 × 1200, se le volvía a cortar al recargar, así que no era solo memoria del teléfono. Si el 3D
// se corta con el juego a la vista, la próxima carga en este equipo es liviana: la página dibuja a
// lo más 720 píxeles de alto (como un teléfono 720p; en el Honor eran 1188) y el juego parte en
// AHORRO, sin suavizado. Queda guardado en el navegador (localStorage «ca-liviano»): «nuevo» la
// primera vez (el juego pone AHORRO y lo recuerda) y «activo» después (la calidad la elige el
// jugador en Ajustes; la imagen sigue limitada). Si se corta incluso así, el aviso lo dice y sugiere
// otro navegador. El aviso muestra además una línea con la gráfica, el navegador y el tamaño de la
// imagen para que el jugador se la mande al propietario: no se envía a ninguna parte.
//
// Modo a prueba de fallas (18 nov 2026): la foto del aviso mostró que la gráfica del amigo es una
// PowerVR BXM-8-256 (chips MediaTek), con fallas conocidas de WebGL en Chrome, y el 3D se cortó
// también en modo liviano. Si se corta incluso así, la próxima carga es «seguro»: además de lo
// liviano, las mascotas usan el sombreado del 13 nov (ese teléfono jugaba bien hasta esa fecha;
// ver GraphicsSettings.start_light_mode). La línea de datos dice
// también en qué etapa se cortó (window.__caFase, la pone el juego) y cuántos shaders y
// animaciones alcanzó a pedir la página.
(function () {
	var LIVIANO_ALTO = 720;
	var mode = '';
	try { mode = localStorage.getItem('ca-liviano') || ''; } catch (e) {}
	window.__caLiviano = mode;
	if (mode === 'nuevo') { try { localStorage.setItem('ca-liviano', 'activo'); } catch (e) {} }
	if (mode) {
		try {
			var own = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
			var realRatio = own && own.get ? own.get : null;
			if (realRatio) Object.defineProperty(window, 'devicePixelRatio', {configurable: true, get: function () {
				var ratio = realRatio.call(window) || 1;
				var side = Math.min(window.innerWidth, window.innerHeight) || 1;
				return Math.min(ratio, Math.max(1, LIVIANO_ALTO / side));
			}});
		} catch (e) {}
	}
	var gpu = '';
	try {
		var probe = document.createElement('canvas').getContext('webgl2');
		if (probe) {
			var info = probe.getExtension('WEBGL_debug_renderer_info');
			gpu = String(probe.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : probe.RENDERER) || '');
			var lose = probe.getExtension('WEBGL_lose_context');
			if (lose) lose.loseContext();
		}
	} catch (e) {}
	// Cuántos shaders y animaciones de malla alcanzó a pedir el juego antes del corte.
	var count = window.__caGL = {shaders: 0, tf: 0};
	try {
		var gl2 = window.WebGL2RenderingContext && WebGL2RenderingContext.prototype;
		if (gl2) {
			var link = gl2.linkProgram, begin = gl2.beginTransformFeedback;
			gl2.linkProgram = function () { count.shaders++; return link.apply(this, arguments); };
			gl2.beginTransformFeedback = function () { count.tf++; return begin.apply(this, arguments); };
			// Gráfica real para Godot (18 nov 2026). Fuera del navegador, Godot apaga el «prepaso de
			// profundidad» en gráficas de celular (PowerVR, Mali, Adreno, Apple): es otra tanda de
			// shaders que esas gráficas no necesitan. En la web WebGL le dice «WebKit WebGL» y nunca lo
			// apagaba. La foto del amigo mostró el corte justo al compilar los primeros shaders 3D, así
			// que en un equipo donde el 3D ya se cortó se le da el nombre real de la gráfica.
			if (mode && gpu) {
				var param = gl2.getParameter;
				gl2.getParameter = function (name) { return name === 0x1F01 ? gpu : param.apply(this, arguments); };
			}
		}
	} catch (e) {}
	var started = Date.now();
	function stage() { return String(window.__caFase || 'pagina').slice(0, 40); }
	function details() {
		var ua = navigator.userAgent || '';
		var browser = /(HonorBrowser|HuaweiBrowser|SamsungBrowser|EdgA|OPR|Firefox|Chrome|Version)[/]([0-9]+)/.exec(ua);
		var canvas = document.getElementById('canvas');
		return [
			gpu.replace(/^ANGLE [(]/, '').replace(/[)]$/, '').slice(0, 60) || 'gráfica ?',
			browser ? browser[1].replace('Version', 'Safari') + ' ' + browser[2] : 'navegador ?',
			canvas ? canvas.width + '×' + canvas.height : '',
			(window.__caReady ? 'jugando' : 'cargando') + ' ' + Math.round((Date.now() - started) / 1000) + ' s',
			'etapa ' + stage(),
			'shaders ' + count.shaders + ' · tf ' + count.tf,
			mode === 'seguro' ? 'seguro' : (mode ? 'liviano' : 'normal')
		].join(' · ');
	}
	var shown = false;
	function show() {
		if (shown) return;
		shown = true;
		// Sin 3D el juego sigue corriendo y sonando detrás (propietario, 16 nov 2026: su amigo quedó
		// en «la pantalla azul con el audio, pero no se podía jugar»). Se calla hasta recargar.
		window.__caMudo = true;
		(window.__caAudio || []).forEach(function (ctx) { try { if (ctx.state === 'running') ctx.suspend(); } catch (e) {} });
		var hidden = document.hidden;
		var kind = hidden ? 'webgl-perdido-fondo' : (mode === 'seguro' ? 'webgl-perdido-seguro' : (mode ? 'webgl-perdido-liviano' : (window.__caReady ? 'webgl-perdido' : 'webgl-perdido-carga')));
		if (window.__caError) {
			window.__caError(kind);
			// Etapa del corte, solo su nombre corto («mascotas», «cancha», «menu», «pelea»).
			if (!hidden) window.__caError('webgl-etapa-' + stage().split(' ')[0]);
		}
		var text;
		if (hidden) {
			text = '<small>El teléfono necesitó memoria mientras el juego estaba en segundo plano y cerró el 3D. Lo que ya tenías guardado sigue ahí; solo la pelea que estabas jugando no cuenta.</small>';
		} else if (!mode) {
			try { localStorage.setItem('ca-liviano', 'nuevo'); } catch (e) {}
			text = '<small>El navegador cerró el 3D del juego. Lo que ya tenías guardado sigue ahí; solo la pelea que estabas jugando no cuenta.</small><small>Al volver, el juego se abre en <b>modo liviano</b>: un poco menos nítido y más fácil para el teléfono.</small>';
		} else if (mode !== 'seguro') {
			try { localStorage.setItem('ca-liviano', 'seguro'); } catch (e) {}
			text = '<small>El navegador cerró el 3D incluso en modo liviano.</small><small>Al volver, el juego se abre en <b>modo a prueba de fallas</b>: más simple para el teléfono.</small>';
		} else {
			text = '<small>El navegador cerró el 3D incluso en modo a prueba de fallas. Prueba abriendo chileanarena.cl en otro navegador (por ejemplo Firefox), actualizando el navegador o cerrando otras pestañas y aplicaciones.</small>';
		}
		var box = document.createElement('div');
		box.id = 'ca-gl';
		box.innerHTML = '<div class=t>Se cortó la imagen del juego</div>' + text + '<button type=button>VOLVER A JUGAR</button><small class=d>Si sigue pasando, mándale una foto de esta pantalla a quien te invitó a jugar:<br><span></span></small>';
		box.querySelector('span').textContent = details();
		box.querySelector('button').addEventListener('click', function () { location.reload(); });
		(document.body || document.documentElement).appendChild(box);
		box.className = 'on';
	}
	var real = window.alert;
	window.alert = function (text) {
		if (/WebGL context lost/i.test(String(text))) { show(); return; }
		return real.apply(window, arguments);
	};
	window.addEventListener('webglcontextlost', function (event) { if (event.target && event.target.id === 'canvas') show(); }, true);
})();
</script>

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {

	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));

		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
