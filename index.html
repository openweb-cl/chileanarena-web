<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Chilean Arena</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0b1636;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="description" content="Chilean Arena: combate arcade de mascotas chilenas, gratis en el navegador. Juego de fans hecho en Chile, no afiliado ni respaldado por ningún club ni por la ANFP. Las mascotas son caricaturas originales.">
<style>
#ca-pc,#ca-rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(8,14,36,.94);color:#f8faff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#ca-pc{z-index:60;cursor:pointer;background:#080e24}#ca-rot{z-index:55}
#ca-pc.on{display:flex}
#ca-pc .t{font-size:30px;font-weight:900;letter-spacing:1px}#ca-pc .t span{color:#f5c542}
#ca-pc .b{background:#f5c542;color:#101a33;font-weight:900;font-size:22px;padding:16px 38px;border-radius:12px;transform:skewX(-8deg);box-shadow:0 6px 0 #b8860b;animation:ca-late 1.2s ease-in-out infinite}
#ca-pc small,#ca-rot small{color:#a5b7d4;font-size:14px;max-width:80vw}
.ca-tel{width:36px;height:60px;border:4px solid #f8faff;border-radius:9px;animation:ca-gira 2.2s ease-in-out infinite}
@keyframes ca-gira{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
@keyframes ca-late{0%,100%{transform:skewX(-8deg) scale(1)}50%{transform:skewX(-8deg) scale(1.06)}}
#ca-pc .g{display:none}
@media (orientation:portrait){#ca-pc .g{display:block}#ca-pc .l{display:none}#ca-rot.on{display:flex}}
#ca-rot .ca-sk{margin-top:6px;min-height:48px;padding:10px 26px;border:2px solid #a5b7d4;border-radius:12px;background:transparent;color:#f8faff;font:800 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#ca-fs{position:fixed;left:8px;top:42%;z-index:58;display:none;width:42px;height:42px;align-items:center;justify-content:center;background:rgba(16,26,51,.7);border:2px solid rgba(245,197,66,.8);border-radius:10px;opacity:.85}
#ca-fs.on{display:flex}
</style>
<script>
(function () {
	var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
	var can = document.fullscreenEnabled || document.webkitFullscreenEnabled;
	// Datos permanentes (propietario, 2 nov 2026): que el navegador no borre la liga ni el nombre
	// por falta de espacio. Chrome lo concede sin preguntar; Firefox pregunta, así que ahí solo se
	// pide dentro del toque de «TOCA PARA JUGAR». No evita que la persona borre los datos.
	function keep() {
		try {
			if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(function (done) { if (!done) navigator.storage.persist(); });
		} catch (e) {}
	}
	if (!/Firefox/.test(navigator.userAgent)) keep();
	if (!touch) return;
	window.__caPantalla = true;
	document.addEventListener('DOMContentLoaded', function () {
		var rot = document.createElement('div');
		rot.id = 'ca-rot';
		// iPhone (propietario, 3 nov 2026: «le dice que gire el teléfono pero no entra al juego»).
		// Con el candado de rotación puesto, o dentro del navegador de Instagram o WhatsApp, la
		// pantalla nunca gira y este aviso tapaba el juego para siempre. Ahora explica cómo
		// destrabarlo y deja seguir igual.
		var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		var inApp = /Instagram|FBAN|FBAV|WhatsApp|Line[/]/.test(navigator.userAgent);
		var help = inApp ? '¿Lo abriste desde Instagram o WhatsApp? Ábrelo en ' + (ios ? 'Safari' : 'Chrome') + ': menú ··· y «Abrir en el navegador»'
			: ios ? '¿No gira? Desliza hacia abajo desde la esquina superior derecha y apaga el candado de rotación'
			: '¿No gira? Activa la rotación automática en los ajustes rápidos';
		rot.innerHTML = '<div class=ca-tel></div><div style=font-size:26px;font-weight:900>Gira el teléfono</div><small>Chilean Arena se juega con el teléfono acostado</small><small>' + help + '</small><button type=button class=ca-sk>Seguir sin girar</button>';
		rot.className = 'on';
		rot.querySelector('.ca-sk').addEventListener('click', function () { rot.className = ''; });
		document.body.appendChild(rot);
		if (!can) return;
		var cover = document.createElement('div');
		cover.id = 'ca-pc';
		cover.innerHTML = '<div class="ca-tel g"></div><img src=index.apple-touch-icon.png width=150 height=150 alt="Chilean Arena"><div class=b>TOCA PARA JUGAR</div><small class=g>Gira el teléfono: se juega acostado y en pantalla completa</small><small class=l>Se abre en pantalla completa</small><small>Un juego creado por <b style=color:#f5c542>Matichoc</b> · Síguenos en Instagram @matichoc.pasion.por.el.cacao</small>';
		var again = document.createElement('div');
		again.id = 'ca-fs';
		again.title = 'Volver a pantalla completa';
		again.setAttribute('aria-label', 'Volver a pantalla completa');
		again.innerHTML = '<svg width=24 height=24 viewBox="0 0 24 24" fill=none stroke=#f5c542 stroke-width=3 stroke-linecap=round><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>';
		document.body.appendChild(cover);
		document.body.appendChild(again);
		var asked = false;
		function full() { return document.fullscreenElement || document.webkitFullscreenElement; }
		function lock() {
			try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
		}
		function sync() {
			cover.classList.toggle('on', !full() && !asked);
			again.classList.toggle('on', !full() && asked);
		}
		function enter(event) {
			if (event) event.preventDefault();
			asked = true;
			keep();
			var page = document.documentElement;
			var request = page.requestFullscreen || page.webkitRequestFullscreen;
			try {
				var done = request.call(page, { navigationUI: 'hide' });
				if (done && done.then) done.then(lock).catch(sync); else lock();
			} catch (e) {}
			sync();
		}
		cover.addEventListener('click', enter);
		again.addEventListener('click', enter);
		document.addEventListener('fullscreenchange', sync);
		document.addEventListener('webkitfullscreenchange', sync);
		sync();
	});
})();
</script>
<script>
// Avisos anónimos de error (propietario, 3 nov 2026: «levantar alertas por posibles cosas malas»).
// Aparecen en GoatCounter como eventos «error/…», solo con el tipo de falla: nunca el texto del
// error, el nombre del jugador ni nada que identifique a la persona. Funcionan aunque el juego no
// alcance a arrancar, por eso viven en la página y no dentro de Godot. Solo en chileanarena.cl.
(function () {
	if (!/(^|[.])chileanarena[.]cl$/.test(location.hostname)) return;
	var sent = {};
	function report(kind) {
		if (sent[kind]) return;
		sent[kind] = true;
		var path = 'error/' + kind, title = 'Error: ' + kind;
		if (window.__caStats) { window.__caStats.send(path, title); return; }
		// GoatCounter aún no está cargado: conteo directo con una imagen.
		var img = new Image();
		img.src = 'https://chileanarena.goatcounter.com/count?e=true&p=' + encodeURIComponent(path) + '&t=' + encodeURIComponent(title) + '&rnd=' + Math.random();
	}
	window.__caError = report;
	// Sin WebGL 2 el 3D del juego no puede abrir.
	try { if (!document.createElement('canvas').getContext('webgl2')) report('webgl'); } catch (e) { report('webgl'); }
	window.addEventListener('error', function () { report('pagina'); });
	window.addEventListener('unhandledrejection', function () { report('pagina'); });
	document.addEventListener('DOMContentLoaded', function () {
		// Godot muestra #status-notice cuando no puede iniciar: navegador sin funciones necesarias o
		// descarga cortada.
		var notice = document.getElementById('status-notice');
		var missing = 0;
		try { missing = window.Engine && Engine.getMissingFeatures ? Engine.getMissingFeatures({threads: false}).length : 0; } catch (e) {}
		if (notice && window.MutationObserver) {
			new MutationObserver(function () {
				if (notice.style.display === 'block') report(missing ? 'navegador' : 'inicio');
			}).observe(notice, {attributes: true, attributeFilter: ['style']});
		}
	});
	// Si tras 2 minutos con la pantalla visible el juego no llegó al menú, se cuenta como carga lenta
	// o trabada (las pestañas en segundo plano no cuentan: el navegador las frena).
	var visible = 0, last = Date.now();
	var timer = setInterval(function () {
		var now = Date.now();
		if (!document.hidden) visible += now - last;
		last = now;
		if (window.__caReady) clearInterval(timer);
		else if (visible > 120000) { report('carga-lenta'); clearInterval(timer); }
	}, 2000);
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":8053776,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
